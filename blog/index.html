    <main class="main" id="main-content">
        <section class="blog-section">

            </div>

            <div class="blog-list" id="blog-list">
                <!-- Blog posts will be listed here -->

                    <p>Posts coming soon.</p>

    <script>
        // Mobile nav toggle
        document.querySelector('.nav-toggle').addEventListener('click', function() {
            const navLinks = document.querySelector('.nav-links');
            const isExpanded = this.getAttribute('aria-expanded') === 'true';
            navLinks.classList.toggle('active');
            this.setAttribute('aria-expanded', !isExpanded);
        });

        // Theme toggle
        (function() {
            const themeToggle = document.querySelector('.theme-toggle');
            const html = document.documentElement;

            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme) {
                html.setAttribute('data-theme', savedTheme);
            } else if (systemPrefersDark) {
                html.setAttribute('data-theme', 'dark');
            }

            themeToggle.addEventListener('click', function() {
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

                if (newTheme === 'light') {
                    html.removeAttribute('data-theme');
                } else {
                    html.setAttribute('data-theme', newTheme);
                }

                localStorage.setItem('theme', newTheme);
            });
        })();
    </script>
    <script>
        // Blog post data - update this array when adding new posts
        // Each post should have: slug, title, date, excerpt
        const posts = [];

        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('en-US', options);
        }

        function renderPosts() {
            const blogList = document.getElementById('blog-list');

            if (posts.length === 0) {
                return; // Keep the "coming soon" message
            }

            blogList.innerHTML = posts.map(post => `
                <a href="posts/${post.slug}.html" class="blog-card">
                    <div class="blog-card-date">${formatDate(post.date)}</div>
                    <h2 class="blog-card-title">${post.title}</h2>
                    <p class="blog-card-excerpt">${post.excerpt}</p>
                </a>
            `).join('');
        }

        renderPosts();
    </script>
